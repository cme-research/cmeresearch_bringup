slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss       # robust to outliers (moving people, bad loop closures) in a dynamic indoor space

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_combined
    use_map_saver: true
    mode: mapping  # Options: mapping, localization

    # Lifecycle manager
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false

    # Timing
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02       # seconds (50 Hz); set to 0 to disable
    map_update_interval: 5.0             # seconds between map saves/updates
    resolution: 0.05                     # meters per pixel
    max_laser_range: 12.0                # meters; LD19 physical max (~12 m). Do not exceed sensor spec.
    minimum_time_interval: 0.5           # seconds; minimum time between scans processed
    transform_timeout: 0.2               # seconds
    tf_buffer_duration: 30.0             # seconds

    # Scan Matcher
    stack_size_to_use: 40000000          # bytes (40 MB); increase if crashes occur

    # Correlative scan matching (initial alignment)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3         # meters; move this far before adding a new node
    minimum_travel_heading: 0.174533     # radians (~10 deg); rotate this far before a new node. Lowered: mecanum wheel odom drifts most in pure rotation, so scan-match sooner.
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0   # match LD19 range / max_laser_range; keep long-range points in the matching buffer
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Coarse (fast but less precise)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Fine (slower but more precise)
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349   # radians (~0.2 deg)
    coarse_search_angle_offset: 0.349   # radians (~20 deg)
    coarse_angle_resolution: 0.0349     # radians (~2 deg)
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true