controller_manager:
  ros__parameters:
    # 50 Hz matches publish_rate below and the ~20 Hz cmd_vel produced by
    # joy2twist / the webapp joystick. At the previous 10 Hz every second
    # incoming cmd_vel was dropped and the 100 ms loop period was visible
    # as ruckelig teleop motion once 90bc2ed restored real gear_ratio.
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    base_mecanum_controller:
      type: mecanum_drive_controller/MecanumDriveController


base_mecanum_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.327


    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false # calculate odometry from feedback if false
    position_feedback: true
    enable_odom_tf: true

    # The upstream parameter is `reference_timeout`, NOT `cmd_vel_timeout` —
    # the latter is a diff_drive_controller param name and is silently ignored
    # by mecanum_drive_controller, which then keeps `ref_timeout_` at its
    # default of 0.0. With ref_timeout=0 every reference is stale on the next
    # update() tick, so between ~20 Hz cmd_vel arrivals the controller writes
    # 0 into the velocity command_interfaces. cmexa_base::write() faithfully
    # republishes that, which surfaces as per-wheel cmd_vel alternating
    # between 0 and real values at the controller_manager rate — visible on
    # /cmexaiii/<wheel>/cmd_vel and felt as ruckelig motion.
    #
    # 1.0 s gives the controller a generous window to tolerate WiFi jitter on
    # the webapp MQTT path and short joypad autorepeat gaps. The safety
    # backstop is twist_mux upstream (0.5 s per-input timeout) plus the
    # `pause_all` lock, not this reference_timeout.
    reference_timeout: 1.0
    #publish_limited_velocity: true
    #velocity_rolling_window_size: 10

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
#    linear.x.has_velocity_limits: true
#    linear.x.has_acceleration_limits: true
#    linear.x.has_jerk_limits: false
#   linear.x.max_velocity: 1.0
#   linear.x.min_velocity: -1.0
#   linear.x.max_acceleration: 1.0
#    linear.x.max_jerk: 0.0
#    linear.x.min_jerk: 0.0

#    linear.y.has_velocity_limits: true
