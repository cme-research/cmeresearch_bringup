# deadzone of joystick axes
deadzone: 0.12
joy_node:
  ros__parameters:
    # Use a stable device path instead of /dev/input/js0
    # Check available devices via: ls /dev/input/by-id/
    dev: /dev/input/js-f710

    # Deadzone for joystick axes (helps with noisy controllers)
    deadzone: 0.05

    # Publish data continuously, even when axes/buttons aren't moving
    autorepeat_rate: 20.0  # Hz

    # Limit the frequency of published messages
    coalesce_interval: 0.001

    # If your joystick has a "sticky" button, increase this
    sticky_buttons: false