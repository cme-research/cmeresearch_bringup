# ============================
# Basic Mosquitto Broker Setup
# ============================

# Listener on default MQTT port
listener 1883
allow_anonymous true
# (Set to false and configure password_file if you want authentication)

persistence true
persistence_location /var/lib/mosquitto/

# ============================
# Bridge Configuration
# ============================
connection bridge-to-remote
address 192.168.1.2:1883

# Optional: username/password if the remote broker requires authentication
# remote_username myuser
# remote_password mypass

# Topics to bridge
# Format: topic <topic> <in|out|both> <local_prefix> <remote_prefix>
# Example: forward everything
topic # both 0 0

# Keepalive for bridge (seconds)
keepalive_interval 60

# Try connecting immediately
start_type automatic

# How often to retry connection (seconds)
restart_timeout 30

# Clean session for the bridge connection
cleansession true

# Optional: log bridging
log_type all

